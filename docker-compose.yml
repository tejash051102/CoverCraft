version: '3.8'

services:
  mongodb:
    image: mongo:7.0-alpine
    container_name: covercraft-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: covercraft
    volumes:
      - mongodb_data:/data/db
    networks:
      - covercraft

  redis:
    image: redis:7-alpine
    container_name: covercraft-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - covercraft

  mongodb-express:
    image: mongo-express:latest
    container_name: covercraft-mongo-express
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongodb
    networks:
      - covercraft

volumes:
  mongodb_data:
  redis_data:

networks:
  covercraft:
    driver: bridge
